<div class="social-links">

  {% if site.github_username %}
  <a class="social-link"
     href="https://github.com/{{ site.github_username | escape }}"
     target="_blank"
     rel="noopener">
    GitHub
  </a>
  {% endif %}

  <a class="social-link"
     href="https://bsky.app/profile/sammcdonald.me"
     target="_blank"
     rel="noopener">
    Bluesky
  </a>

  <a class="social-link"
     href="{{ '/feed.xml' | relative_url }}">
    RSS
  </a>

</div>
