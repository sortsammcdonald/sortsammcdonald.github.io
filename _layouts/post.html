---
layout: default
---

<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>

    <p class="post-meta">
      {{ page.date | date: "%B %-d, %Y" }}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% if page.tags %}
  <p class="post-tags">
    Tags:
    {% for tag in page.tags %}
      <a href="{{ "/tags/#" | append: tag | relative_url }}">{{ tag }}</a>
    {% endfor %}
  </p>
  {% endif %}

</article>
